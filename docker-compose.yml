services:
  postgres:
    image: pgvector/pgvector:pg16        # 带 pgvector 扩展的 PostgreSQL 16
    container_name: ragna-postgres
    environment:
      POSTGRES_DB: ragna
      POSTGRES_USER: ragna
      POSTGRES_PASSWORD: ragna123
    ports:
      - "5432:5432"
    volumes:
      - ragna_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ragna-redis
    ports:
      - "6379:6379"
    volumes:
      - ragna_redisdata:/data

volumes:
  ragna_pgdata:
  ragna_redisdata: